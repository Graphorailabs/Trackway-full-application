services:
  # ---------------- DEV (LOCAL ONLY) ----------------
  client-dev:
    image: node:22-alpine
    container_name: trackway-frontend-dev
    working_dir: /app
    volumes:
      - ./:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: sh -c "npm ci --silent || true && npm run dev -- --host 0.0.0.0"
    tty: true

  # ---------------- PROD (DOCKER HUB) ----------------
  client-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphoraailabs/trackway-frontend:prod
    container_name: trackway-frontend-prod
    ports:
      - "4173:4173"
    restart: unless-stopped
